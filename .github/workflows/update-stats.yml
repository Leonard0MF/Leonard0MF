name: Update GitHub stats

on:
  schedule:
    - cron: "17 * * * *"   # a cada hora
  workflow_dispatch:         # botão "Run workflow" pra atualizar na hora
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update-stats.yml"]

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats.svg
        env:
          # STATS_TOKEN (opcional) = token pessoal; sem ele usa o token padrão da Action
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          node scripts/update-stats.mjs
          test -s stats.svg || { echo "::error::stats.svg não foi gerado — confira se scripts/update-stats.mjs tem o código"; exit 1; }

      - name: Commit if changed
        run: |
          git add stats.svg
          if git diff --cached --quiet; then
            echo "Sem mudanças"; exit 0
          fi
          # commit feito pelo bot: NÃO conta como contribuição sua
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update stats"
          git push
